  coupler_file: Data/inputs/lam_c1667/bkg/20201215.000000.rrfs_C1667.coupler.res

  temperature_variable: T

obs:

  template: surface_t2m_obs_ref.nc4

  output: surface_t2m_obs_c1667.nc4

