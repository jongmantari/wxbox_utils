geometry:

  fms initialization:

    namelist filename:
      Data/fv3files/fmsmpp.nml

    field table filename:
      Data/fv3files/field_table_lam_rrfs

  akbk:
    Data/inputs/lam_akbk/INPUT/akbk65.nc

  namelist filename:
    Data/fv3files/input_lam_c1667.nml


time window:

  begin:
    2026-07-23T11:00:00Z

  length:
    PT2H


background:

  members from template:

    template:

      datetime:
        2026-07-23T12:00:00Z

      filetype:
        fms restart

      state variables:

      - air_temperature
      - air_pressure_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      - geopotential_height_times_gravity_at_surface

      field io names:

        air_temperature: T

        air_pressure_thickness: DELP

        water_vapor_mixing_ratio_wrt_moist_air: sphum

        geopotential_height_times_gravity_at_surface: phis

      datapath:
        runs/c1667/20260723T12Z/ensemble/mem%mem%/

      filename_core:
        hrrr.fv_core.res.tile1.nc

      filename_trcr:
        hrrr.fv_tracer.res.tile1.nc

      filename_cplr:
        20201215.000000.rrfs_C1667.coupler.res

    pattern: "%mem%"

    nmembers: 5

    zero padding: 2


observations:

  observers:

  - obs space:

      name:
        Tempest

      distribution:

        name:
          Halo

        halo size: 100000.0

      obsdatain:

        engine:

          type:
            H5File

          obsfile: iem_asos_obs_20260723T120000Z_obserror.nc4

      obsdataout:

        engine:

          type:
            H5File

          obsfile:
            runs/c1667/20260723T12Z/letkf/tempest_diagnostics.nc4

      simulated variables:

      - airTemperatureAt2M

      obs perturbations seed: 1

    obs operator:

      name:
        SfcCorrected

      correction scheme to use:
        WRFDA

    obs error:

      covariance model:
        diagonal

      obs perturbations amplitude: 1.0

    diagnostics:

      - airTemperatureAt2M

    obs localizations:

    - localization method:
        Horizontal Gaspari-Cohn

      lengthscale:
        100000.0

      max nobs:
        50


driver:

  save posterior ensemble: true

  save posterior mean increment: true


local ensemble DA:

  solver:
    Stochastic LETKF

  inflation:

    rtps: 0.9

    rtpp: 0.72

    mult: 1.2


output:

  filetype:
    fms restart

  field io names:

    air_temperature: T

    air_pressure_thickness: DELP

    water_vapor_mixing_ratio_wrt_moist_air: sphum

    geopotential_height_times_gravity_at_surface: phis

  datapath:
    runs/c1667/20260723T12Z/letkf/analysis/mem%{member}%/


output increment:

  filetype:
    fms restart

  field io names:

    air_temperature: T

    air_pressure_thickness: DELP

    water_vapor_mixing_ratio_wrt_moist_air: sphum

    geopotential_height_times_gravity_at_surface: phis

  datapath:
    runs/c1667/20260723T12Z/letkf/increment/